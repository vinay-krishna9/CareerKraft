<a
  class="flex cursor-pointer h-80 items-center justify-center rounded-xl border-2 border-slate-300 bg-white p-6 text-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
  [class.border-dashed]="variant() === 'dashed'"
  aria-label="Create new resume"
>
  <div class="text-center">
    <ng-content />

    <p class="mt-3 text-sm font-medium">
      {{ title() }}
    </p>

    <ng-content />
  </div>
</a>
